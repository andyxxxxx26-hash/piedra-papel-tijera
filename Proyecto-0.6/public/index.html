<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piedra, Papel o Tijera - Multijugador Local</title>
    <link rel="stylesheet" href="styles.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="Juego">
        <h1>Piedra, Papel o Tijera</h1>
        <p id="rolTexto" class="subtitulo">Conectando...</p>

        <div class="marcador">
            <div class="score-box">
                <span class="label">Jugador 1</span>
                <span id="scoreJ1" class="points">0</span>
            </div>
            <div class="score-divider">:</div>
            <div class="score-box">
                <span class="label">Jugador 2</span>
                <span id="scoreJ2" class="points">0</span>
            </div>
        </div>

        <div class="resultado">
            <p id="eleccionJ1">Jugador 1: -</p>
            <p id="eleccionJ2">Jugador 2: -</p>
            <h2 id="resultadoTexto">Esperando al otro jugador...</h2>
        </div>

        <p id="instruccion">Elige una opción:</p>

        <div class="opciones">
            <button class="piedra" title="Piedra"></button>
            <button class="papel" title="Papel"></button>
            <button class="tijera" title="Tijera"></button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
