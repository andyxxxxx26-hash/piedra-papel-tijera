<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e1e2f">
    <title>Piedra, Papel o Tijera - Con Salas</title>

    <!-- Permitir conexiones WebSocket y HTTP hacia Render desde la APK -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval' 'unsafe-inline' https://piedra-papel-tijera-9k7e.onrender.com wss://piedra-papel-tijera-9k7e.onrender.com https://cdn.socket.io; connect-src 'self' https://piedra-papel-tijera-9k7e.onrender.com wss://piedra-papel-tijera-9k7e.onrender.com;">

    <link rel="stylesheet" href="styles.css?v=3">
    <!-- Cargar cliente de Socket.io desde CDN para compatibilidad con la APK -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <div class="Juego">
        <h1>Piedra, Papel o Tijera</h1>

        <!-- Pantalla de Lobby (Salas) -->
        <div id="lobbyContainer">
            <!-- CAMPO DE ENTRADA PARA EL NOMBRE -->
            <div class="lobby-input-group" style="margin-bottom: 12px;">
                <input type="text" id="inputNombre" placeholder="Tu Nombre / Apodo" maxlength="12">
            </div>

            <button id="btnCrear" class="btn-lobby">Crear Sala Privada</button>
            <hr class="lobby-divider">
            
            <div class="lobby-input-group">
                <input type="text" id="inputCodigo" placeholder="Código de Sala (ej. A1B2)" maxlength="4">
                <button id="btnUnirse" class="btn-lobby">Unirse a Sala</button>
            </div>
            
            <p id="errorLobby"></p>
        </div>

        <!-- Pantalla del Juego (Oculta al inicio) -->
        <div id="juegoContainer" style="display: none;">
            <p id="codigoTexto" class="subtitulo">Código de sala: <b id="codigoDisplay">----</b></p>
            <p id="rolTexto" class="subtitulo">Conectando...</p>
            <h3 id="timerTexto">Tiempo restante: <span id="timerDisplay">15</span>s</h3>

            <div class="marcador">
                <div class="score-box">
                    <span id="labelJ1" class="label">Jugador 1</span>
                    <span id="scoreJ1" class="points">0</span>
                </div>
                <div class="score-divider">:</div>
                <div class="score-box">
                    <span id="labelJ2" class="label">Jugador 2</span>
                    <span id="scoreJ2" class="points">0</span>
                </div>
            </div>

            <div class="resultado">
                <p id="eleccionJ1">Jugador 1: -</p>
                <p id="eleccionJ2">Jugador 2: -</p>
                <h2 id="resultadoTexto">Esperando al otro jugador...</h2>
            </div>

            <p id="instruccion">Elige una opción:</p>

            <div class="opciones">
                <button class="piedra" title="Piedra"></button>
                <button class="papel" title="Papel"></button>
                <button class="tijera" title="Tijera"></button>
            </div>

            <!-- REACCIONES DE EMOJIS -->
            <div class="reacciones-container">
                <button class="btn-emoji" data-emoji="😜" title="Burlón">😜</button>
                <button class="btn-emoji" data-emoji="😡" title="Enojado">😡</button>
                <button class="btn-emoji" data-emoji="😄" title="Sonriendo">😄</button>
                <button class="btn-emoji" data-emoji="😍" title="Amor">😍</button>
            </div>

            <div id="emojiOverlay" class="emoji-overlay"></div>
        </div>
    </div>

    <script src="app.js?v=7"></script>
</body>
</html>
